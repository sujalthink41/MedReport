# Guardrails that run before every commit.
# Install once:  uv run pre-commit install

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=500"]

  - repo: local
    hooks:
      # Health data must never reach git history. Once committed, a rewrite is
      # the only cure — so this is a hard block, not a warning.
      - id: no-health-documents
        name: block PDFs and images (possible health data)
        entry: >-
          bash -c 'echo "Blocked: report files must never be committed. See .gitignore"; exit 1'
        language: system
        files: '\.(pdf|jpe?g|png|heic|dcm)$'
        exclude: '^docs/'

      - id: ruff-check
        name: ruff (lint)
        entry: uv run ruff check --fix
        language: system
        types: [python]
        pass_filenames: true

      - id: ruff-format
        name: ruff (format)
        entry: uv run ruff format
        language: system
        types: [python]
        pass_filenames: true

      - id: mypy
        name: mypy
        entry: uv run mypy app
        language: system
        types: [python]
        pass_filenames: false

      - id: import-linter
        name: dependency rule (hexagonal layers)
        entry: uv run lint-imports
        language: system
        types: [python]
        pass_filenames: false
