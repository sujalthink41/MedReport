[alembic]
script_location = alembic

# Timestamped, readable filenames instead of a bare hash. When you are staring at
# `alembic history` at 2am, "2026_09_06_1412-a3f9_initial_schema.py" tells you far
# more than "a3f9c21b4e77.py".
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

prepend_sys_path = .
path_separator = os
timezone = UTC

# No sqlalchemy.url here on purpose. The URL comes from Settings in env.py, so
# there is exactly one place credentials live: the environment. A database URL in
# a committed ini file is how production passwords end up on GitHub.

[post_write_hooks]
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
