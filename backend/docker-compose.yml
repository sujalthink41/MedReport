# Local development infrastructure only.
# The API runs on the host via `uv run` so reloads are instant.
# CP25 adds the production compose file with api/worker/caddy services.

name: medreport

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: medreport
      POSTGRES_PASSWORD: medreport
      POSTGRES_DB: medreport
    ports:
      # 5433, not 5432: this machine already runs a native Postgres on the
      # default port. Containers get their own port so both can coexist and
      # nobody has to stop a service they rely on.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Compose waits for this before dependents start — no sleep-and-hope.
      test: ["CMD-SHELL", "pg_isready -U medreport -d medreport"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      # 6380 for the same reason - a native Redis holds 6379.
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
